<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Transcriptions</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
    <div>
      <h1>Transcriptions</h1>
      <p class="sub" id="summary">Everything you have dictated, kept on this Mac.</p>
    </div>
    <button id="clear" class="quiet" style="-webkit-app-region: no-drag">Clear all</button>
  </header>

  <main>
    <input id="search" class="search" type="search" placeholder="Search transcriptions" spellcheck="false" />
    <div class="group" id="list" style="margin-top: 14px"></div>
  </main>

  <script src="history.js"></script>
</body>
</html>
