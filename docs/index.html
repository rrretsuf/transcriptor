<style>
:root {
    --paper: #ffffff;
    --ink: #111214;
    --muted: #6b7079;
    --line: #dcdfe4;
    color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
    :root { --paper: #18191b; --ink: #f2f3f4; --muted: #9a9fa8; --line: #3a3d43; }
}
* { box-sizing: border-box; }
body {
    min-height: 100svh;
    margin: 0;
    padding: 32px 24px;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Ubuntu, Cantarell, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
}
main { width: 100%; max-width: 340px; }
img { display: block; width: 88px; height: 88px; margin: 0 auto; }
h1 { margin: 18px 0 0; font-size: 1.6rem; font-weight: 650; letter-spacing: -0.02em; }
p { margin: 0; color: var(--muted); }
.what { margin-top: 6px; text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.downloads { display: grid; gap: 10px; margin-top: 32px; }
.downloads a, .downloads span {
    display: block;
    padding: 12px 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-weight: 550;
    text-decoration: none;
}
.downloads a:hover { border-color: var(--ink); }
.downloads .here {
    order: -1;
    padding: 16px 20px;
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-size: 1.06rem;
}
.downloads span { color: var(--muted); font-weight: 400; }
.small { margin-top: 20px; font-size: 0.86rem; }
</style>
</head>

<script>
// ?os=windows shows the page as another system sees it.
function detect() {
    const asked = new URLSearchParams(location.search).get('os');
    if (asked) return asked;
    const platform = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();
    const agent = navigator.userAgent.toLowerCase();
    if (/android|iphone|ipad|ipod/.test(agent) || (platform.includes('mac') && navigator.maxTouchPoints > 1)) return null;
    if (platform.includes('mac')) return 'mac';
    if (platform.includes('win')) return 'windows';
    if (platform.includes('linux') || /x11|cros/.test(agent)) return 'linux';
    return null;
}

const here = document.querySelector(`[data-os="${detect()}"]`);
if (here) {
    here.classList.add('here');
    here.textContent = `Download for ${here.textContent}`;
}

// The latest release decides what can be downloaded today; without an answer the links stay as they are.
fetch('https://api.github.com/repos/rrretsuf/transcriptor/releases/latest')
    .then(response => response.ok ? response.json() : Promise.reject())
    .then(release => {
        const files = new Set(release.assets.map(asset => asset.name));
        document.getElementById('version').textContent = `Version ${release.tag_name.replace(/^v/, '')}. `;
        for (const link of document.querySelectorAll('[data-file]')) {
            if (files.has(link.dataset.file)) continue;
            const soon = document.createElement('span');
            soon.className = link.className;
            soon.textContent = `${link.textContent.replace('Download for ', '')} is coming soon`;
            link.replaceWith(soon);
        }
    })
    .catch(() => {});
</script>
